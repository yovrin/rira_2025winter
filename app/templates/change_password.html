<!-- templates/change_password.html -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>パスワード変更</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-3">パスワード変更</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{cat}} py-2">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="mb-3">
          <label class="form-label">新しいパスワード</label>
          <input type="password" name="new_password" class="form-control" required minlength="5">
        </div>
        <div class="mb-3">
          <label class="form-label">確認用パスワード</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="5">
        </div>
        <button class="btn btn-primary w-100" type="submit">変更する</button>
      </form>

      <hr>
      <a class="btn btn-outline-secondary w-100" href="{{ url_for('main.logout') }}">ログアウト</a>
    </div>
  </div>
</div>
</body>
</html>
