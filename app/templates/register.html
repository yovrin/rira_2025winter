<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ユーザ登録</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 480px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-3">新規ユーザ登録</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{cat}} py-2">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="mb-3">
          <label class="form-label">ユーザー名(学籍番号、個人IDなんでも良いです。)</label>
          <input type="text" name="uname" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">パスワード</label>
          <input type="password" name="passwd" class="form-control" required>
        </div>
        <button class="btn btn-success w-100" type="submit">登録</button>
      </form>

      <div class="mt-3 text-center">
        <a href="{{ url_for('main.login') }}">ログイン画面へ戻る</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
